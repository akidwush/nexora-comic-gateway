<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1480" viewBox="0 0 640 1480" role="img" aria-labelledby="title desc">
  <title id="title">NEXORA original comic-style image transfer test</title>
  <desc id="desc">A self-created series of abstract panels with colored hills and geometric shapes, for testing Cloudflare static image delivery.</desc>
  <defs>
