    <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#3f83c4"/><stop offset="1" stop-color="#1fbaaa"/></linearGradient>
  </defs>
  <rect width="640" height="1480" fill="#f5f7fb"/>
  <rect x="24" y="24" width="592" height="74" rx="18" fill="#152449"/>
