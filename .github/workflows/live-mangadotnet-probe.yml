name: Temporary V1 MangaDotNet Legacy Production Probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify V1 production keeps MangaDotNet off Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          origin='https://all-tools-nexora-teal.vercel.app'
          pages_url="$origin/api/comics?action=pages&source=mangadotnet&id=upload%3A2169880&mangaId=24328&quality=saver&mode=comic-reader"
          ua='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'

          pages_status=$(curl --silent --show-error --max-time 30 -o /tmp/pages.json -w '%{http_code}' \
            -H "User-Agent: $ua" -H "Referer: $origin/" "$pages_url")
          echo "pages_status=$pages_status"
          test "$pages_status" = "200"

          legacy_url=$(node - <<'NODE'
          const fs=require("fs");
          const root=JSON.parse(fs.readFileSync("/tmp/pages.json","utf8"));
          let gateway=0, legacy=[];
          const walk=v=>{
            if(typeof v==="string"){
              if(v.startsWith("https://nexora-comic-gateway.furinafontain001.workers.dev/v1/public-image?")) gateway++;
              if(v.startsWith("/api/comics?action=page-image&source=mangadotnet")) legacy.push(v);
              return;
            }
            if(Array.isArray(v)) for(const x of v) walk(x);
            else if(v&&typeof v==="object") for(const x of Object.values(v)) walk(x);
          };
          walk(root);
          console.error("gateway_url_count="+gateway);
          console.error("legacy_url_count="+legacy.length);
          if(gateway!==0||legacy.length<1) process.exit(2);
          process.stdout.write(legacy[0]);
          NODE
          )

          image_status=$(curl --silent --show-error --max-time 30 -D /tmp/image-headers -o /tmp/image.bin -w '%{http_code}' \
            -H "User-Agent: $ua" -H "Referer: $origin/" "$origin$legacy_url")
          echo "image_status=$image_status"
          test "$image_status" = "200"
          grep -qi '^content-type: image/' /tmp/image-headers
          test -s /tmp/image.bin
          echo "MangaDotNet production delivery is direct Vercel legacy with no Cloudflare gateway URL."
